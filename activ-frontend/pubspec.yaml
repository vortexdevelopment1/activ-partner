  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: FontBold
      fonts:
        - asset: fonts/Acumin-BdPro.otf
    - family: FontMedium
      fonts:
        - asset: fonts/AcuminPro-Medium.otf
    - family: FontRegular
      fonts:
        - asset: fonts/Acumin-RPro.otf
    - family: FontRegularItalic
      fonts:
        - asset: fonts/Metropolis-RegularItalic.otf
    - family: FontSemiBold
      fonts:
        - asset: fonts/AcuminPro-Semibold.otf
    - family: Satoshi
      fonts:
        - asset: fonts/Satoshi-Medium.otf
          weight: 500
        - asset: fonts/Satoshi-Bold.otf
          weight: 700
