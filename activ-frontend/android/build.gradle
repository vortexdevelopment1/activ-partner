buildscript {
    ext {
        kotlin_version = '2.3.20'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        sub.androidComponents {
            finalizeDsl { extension ->
                if (extension.compileSdk == null || extension.compileSdk < 36) {
                    extension.compileSdk = 36
                }
            }
        }
    }
    sub.tasks.matching { it.class.name.contains("KotlinCompile") }.configureEach { task ->
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null && androidExt.compileOptions?.targetCompatibility != null) {
            def target = androidExt.compileOptions.targetCompatibility.toString()
            if (task.hasProperty("kotlinOptions")) {
                task.kotlinOptions.jvmTarget = target
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}