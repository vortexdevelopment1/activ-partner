allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
// Add the buildscript block to include the Google services plugin
buildscript {
    ext {
        // Define the Kotlin version here
        kotlin_version = '2.2.21'  // or any other version you need
    }

    repositories {
        google()  // Ensure google() is listed here
        mavenCentral()
    }

    dependencies {
        // Add the classpath for the google-services plugin
        classpath 'com.google.gms:google-services:4.4.4'  // or your preferred version
    }
}